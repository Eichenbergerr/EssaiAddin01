<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Complément Word — Image & Légende</title>

    <!-- Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Fluent UI Core (Fabric) -->
    <link rel="stylesheet"
        href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css" />

    <!-- Styles -->
    <link href="insertImage.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img class="header-logo" src="../../assets/logo-filled.png" alt="Logo" />
        <h1 class="ms-font-su">Exercice : Image & Légende centrée</h1>
    </header>

    <section id="sideload-msg" class="ms-welcome__main">
        <h2 class="ms-font-xl">
            Merci de
            <a target="_blank"
                href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">sideload</a>
            votre complément pour afficher le panneau.
        </h2>
    </section>

    <div class="helper">
        Conseil : insérez l’image dans l’encart « IMAGE_PLACEHOLDER », puis ajoutez une légende.
    </div>

    <div class="actions" role="group" aria-label="Actions exercice">
        <button id="btn-init" class="ms-welcome__action ms-Button ms-Button--hero ms-font-m" type="button">
            <span class="ms-Button-label">Initialiser le document</span>
        </button>

        <button id="btn-validate" class="ms-welcome__action ms-Button ms-Button--hero ms-font-m" type="button">
            <span class="ms-Button-label">Valider l’exercice</span>
        </button>
    </div>

    <!-- Bloc de confirmation effacement -->
    <div id="confirm-clear"
        style="display:none; width:100%; max-width:520px; margin-top:12px; padding:12px; border:1px solid #ffd8d8; background:#fff5f5; border-radius:8px;">
        <div class="ms-font-m" style="margin-bottom:8px;">
            Le document contient déjà du texte. Voulez-vous <b>tout effacer</b> avant d'initialiser ?
        </div>
        <div style="display:flex; gap:8px;">
            <button id="btn-clear-yes" class="ms-Button ms-Button--hero ms-font-s" type="button">
                <span class="ms-Button-label">Oui, effacer</span>
            </button>
            <button id="btn-clear-no" class="ms-Button ms-Button--hero ms-font-s" type="button">
                <span class="ms-Button-label">Non, annuler</span>
            </button>
        </div>
    </div>


    <div id="report" aria-live="polite" aria-atomic="true"></div>
    </main>

    <!-- Script applicatif unique -->
    <script src="./insertImage.js"></script>
</body>

</html>
